<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conteo de Centros Florales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef2f6;color:#32363a;font-size:16px}
  .wrap{max-width:560px;margin:0 auto;padding:10px 8px 30px}
  /* Login */
  .login-box{max-width:380px;margin:40px auto;background:#fff;border-radius:16px;padding:28px 24px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
  .login-box h1{font-size:20px;color:#354a5f;margin-bottom:4px;text-align:center}
  .login-box .sub{font-size:13px;color:#888;text-align:center;margin-bottom:22px}
  .login-box input{width:100%;padding:14px;font-size:16px;border:2px solid #d9d9d9;border-radius:10px;margin-bottom:12px}
  /* Topbar */
  .topbar{background:#354a5f;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
  .topbar .t-title{font-size:16px;font-weight:800}
  .topbar .t-sub{font-size:11px;opacity:.8}
  /* Botones */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;font-size:16px;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:#0a6ed1;color:#fff}
  .btn-green{background:#1a7e3e;color:#fff}
  .btn-gray{background:#fff;color:#354a5f;border:2px solid #d9d9d9}
  .btn-amber{background:#e9730c;color:#fff}
  .btn-red{background:#fff;color:#c0392b;border:2px solid #f0b8b8}
  .btn-sm{padding:9px 14px;font-size:13px;width:auto;margin-bottom:0}
  /* Campos */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:#354a5f;margin-bottom:5px}
  .field select,.field input{width:100%;padding:13px;font-size:16px;border:2px solid #d9d9d9;border-radius:10px;background:#fff;color:#32363a}
  /* Cards */
  .card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin-bottom:12px}
  .sync-bar{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;font-size:12px;font-weight:600;margin-bottom:11px}
  /* Contador */
  .counter-box{border:2px solid #0a6ed1;background:#f0f7ff;border-radius:14px;padding:14px;margin-bottom:14px}
  .counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .counter button{width:74px;height:74px;border-radius:18px;border:none;font-size:38px;font-weight:700;cursor:pointer;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-shrink:0}
  .counter button:active{transform:scale(.94)}
  .counter .minus{background:#c0392b}.counter .plus{background:#0a6ed1}
  .counter .val{font-size:60px;font-weight:800;flex:1;text-align:center;color:#23303d;line-height:1}
  .hdr-mini{background:#354a5f;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .arbol-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #eee;font-size:15px}
  .gps-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  table.rep{width:100%;border-collapse:collapse;font-size:13px}
  table.rep th{background:#354a5f;color:#fff;padding:8px;text-align:left;font-size:12px}
  table.rep td{padding:7px 8px;border-bottom:1px solid #eee}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23303d;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90%;text-align:center}
  .pill{padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal-card{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:22px;max-height:88vh;overflow-y:auto}
  /* Layout con barra lateral de administración */
  .layout{display:flex;width:100%;gap:0}
  .sidebar{width:230px;flex-shrink:0;background:#2b3d4f;min-height:calc(100vh - 49px);padding:14px 10px;position:sticky;top:49px;align-self:flex-start}
  .sidebar .side-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#7d93a8;padding:14px 10px 6px}
  .side-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;color:#dbe5ee;font-size:14px;font-weight:600;padding:11px 12px;border-radius:9px;cursor:pointer;margin-bottom:2px}
  .side-link:hover{background:rgba(255,255,255,.08)}
  .side-link.active{background:#1a7e3e;color:#fff}
  .side-badge{margin-left:auto;background:#e9730c;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
  .main-area{flex:1;min-width:0;padding:0 8px;display:flex;justify-content:center}
  .main-area .wrap{width:100%;max-width:620px;padding:14px 12px 30px}
  /* Botón menú móvil */
  .menu-btn{display:none;background:rgba(255,255,255,.2);color:#fff;border:none;font-size:20px;padding:6px 12px;border-radius:8px;cursor:pointer;margin-right:10px}
  @media(max-width:760px){
    .layout{display:block}
    .sidebar{position:fixed;left:0;top:49px;bottom:0;z-index:60;width:250px;transform:translateX(-100%);transition:transform .25s;box-shadow:2px 0 16px rgba(0,0,0,.3);min-height:auto}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:inline-block}
    .sidebar-overlay{display:none;position:fixed;inset:49px 0 0 0;background:rgba(0,0,0,.4);z-index:55}
    .sidebar-overlay.open{display:block}
    .main-area{padding:0}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-area"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   CONTEO DE CENTROS FLORALES — App independiente (solo Firebase)
   Sin conexión con otros módulos. Datos en colección 'conteos_centros'.
   ═══════════════════════════════════════════════════════════════════ */

// ───── USUARIOS INICIALES (semilla; luego se administran en Firebase) ─────
// Roles: 'admin' (todo), 'supervisor' (ve todo, no configura), 'contador' (solo cuenta)
// Estos son los usuarios base. El admin puede crear/editar más en Configuración.
var USUARIOS_SEED = {
  'admin':     { clave:'admincabana', rol:'admin',     nombre:'Administrador' },
  'contador1': { clave:'cabana2026',  rol:'contador',  nombre:'Contador 1' },
  'contador2': { clave:'cabana2026',  rol:'contador',  nombre:'Contador 2' }
};
var ROLES = {
  'admin':      'Administrador',
  'supervisor': 'Supervisor',
  'contador':   'Contador'
};

// ───── FIREBASE (misma cuenta, colección aparte) ─────
var FB_CONFIG = {
  apiKey: "AIzaSyCl2CDK9tzMZQ5iJmDlYqAxZeV_Pw_rgqE",
  authDomain: "cuaderno-de-campo-d2922.firebaseapp.com",
  projectId: "cuaderno-de-campo-d2922",
  storageBucket: "cuaderno-de-campo-d2922.firebasestorage.app",
  messagingSenderId: "112356988045",
  appId: "1:112356988045:web:432a76e2fe6826b4abfec4"
};
var COLECCION = 'conteos_centros';   // colección independiente
var COLECCION_ESTIM = 'estimaciones_centros';  // estimaciones (versiones guardadas)
var COLECCION_USERS = 'usuarios_conteo';  // usuarios de la app (editables, sincronizados)
var COLECCION_PANOS = 'panos_centros';  // paños/cuarteles (sincronizados en la nube)
var db = null, fbOk = false;

function initFirebase(){
  try{
    firebase.initializeApp(FB_CONFIG);
    db = firebase.firestore();
    fbOk = true;
    console.log('[Firebase] Conectado a', COLECCION);
  }catch(e){ console.warn('[Firebase] No disponible:', e); fbOk=false; }
}

// ───── PAÑOS PRECARGADOS (editables) ─────
// El contador puede modificarlos en "Paños". Se guardan localmente.
var PANOS_DEFAULT = [
  { id:'p1', nombre:'Cuartel 1', variedad:'Regina', plantas:0 },
  { id:'p2', nombre:'Cuartel 2', variedad:'Skeena', plantas:0 },
  { id:'p3', nombre:'Cuartel 3', variedad:'Lapins', plantas:0 },
  { id:'p4', nombre:'Cuartel 4', variedad:'Kordia', plantas:0 }
];
var VARIEDADES = ['Regina','Skeena','Lapins','Kordia','Bing','Santina','Sweetheart','Rainier'];

// ───── ESTADO ─────
var APP = {
  user: null,          // { id, nombre, rol }
  vista: 'inicio',     // inicio | sesion | lista | panos | estim | estimVer | config
  panos: [],
  sesion: null,
  conteos: [],         // registros guardados (local + nube)
  estimaciones: [],    // versiones de estimación guardadas
  estimActual: null,   // estimación en edición
  usuarios: {},        // usuarios editables (de Firebase + semilla)
  valActual: 0,
  varFiltro: ''
};

// Helpers de permisos
function esAdmin(){ return APP.user && APP.user.rol==='admin'; }
function esSupervisor(){ return APP.user && (APP.user.rol==='admin'||APP.user.rol==='supervisor'); }

// ───── UTILIDADES ─────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.getElementById('toast-area').appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(function(){t.remove();},300); }, 2600);
}
function lsGet(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ───── INICIO / LOGIN ─────
function init(){
  initFirebase();
  APP.panos = lsGet('cc_panos', null) || PANOS_DEFAULT.slice();
  APP.conteos = lsGet('cc_conteos', []);
  APP.estimaciones = lsGet('cc_estimaciones', []);
  // Usuarios: combinar semilla + los guardados localmente (respaldo offline)
  APP.usuarios = lsGet('cc_usuarios', null) || JSON.parse(JSON.stringify(USUARIOS_SEED));
  cargarUsuariosNube();  // refresca desde Firebase si hay conexión
  var savedUser = lsGet('cc_user', null);
  if(savedUser){ APP.user = savedUser; render(); cargarPanosNube(); cargarDesdeNube(); cargarEstimNube(); }
  else { renderLogin(); }
}

function renderLogin(){
  document.getElementById('app').innerHTML =
    '<div class="login-box">'+
      '<h1>🌸 Conteo de Centros Florales</h1>'+
      '<div class="sub">Sociedad Agrícola y Forestal La Cabaña</div>'+
      '<div class="field"><label>Usuario</label><input type="text" id="lg-user" autocapitalize="none" placeholder="usuario"></div>'+
      '<div class="field"><label>Clave</label><input type="password" id="lg-pass" placeholder="clave"></div>'+
      '<button class="btn btn-primary" onclick="doLogin()">Ingresar</button>'+
    '</div>';
}
function doLogin(){
  var u=(document.getElementById('lg-user').value||'').trim().toLowerCase();
  var p=(document.getElementById('lg-pass').value||'').trim();
  var info = APP.usuarios[u];
  if(info && info.clave===p){
    APP.user = { id:u, nombre:info.nombre||u, rol:info.rol||'contador' };
    lsSet('cc_user', APP.user);
    render();
    cargarDesdeNube();
    cargarEstimNube();
    toast('Bienvenido, '+(info.nombre||u));
  } else {
    toast('Usuario o clave incorrectos');
  }
}
function logout(){
  localStorage.removeItem('cc_user');
  APP.user=null; APP.vista='inicio';
  renderLogin();
}

// ───── RENDER PRINCIPAL ─────
function render(){
  if(!APP.user){ renderLogin(); return; }
  var online = navigator.onLine && fbOk;
  var pend = APP.conteos.filter(function(x){return !x.sincronizado;}).length;
  var top = '<div class="topbar">'+
      '<div style="display:flex;align-items:center">'+
        '<button class="menu-btn" onclick="toggleMenu()">☰</button>'+
        '<div><div class="t-title">🌸 Conteo Centros</div><div class="t-sub">'+esc(APP.user.nombre)+' · '+esc(ROLES[APP.user.rol]||APP.user.rol)+'</div></div>'+
      '</div>'+
      '<button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:#fff;margin-bottom:0" onclick="logout()">Salir</button>'+
    '</div>';
  var sync = '<div class="sync-bar" style="background:'+(online?'#d1f0d8':'#fde8c8')+';color:'+(online?'#0a6e2e':'#7a4200')+'">'+
      (online?'🟢 Conectado':'🔴 Sin conexión')+(pend>0?(' · '+pend+' por subir'):' · todo sincronizado')+
    '</div>';
  var body='';
  if(APP.vista==='sesion' && APP.sesion){ body=renderSesion(); }
  else if(APP.vista==='lista'){ body=renderLista(); }
  else if(APP.vista==='panos'){ body=renderPanos(); }
  else if(APP.vista==='estim'){ body=renderEstim(); }
  else if(APP.vista==='estimVer' && APP.estimActual){ body=renderEstimVer(); }
  else if(APP.vista==='config'){ body=renderConfig(); }
  else { body=renderInicio(); }
  document.getElementById('app').innerHTML = top +
    '<div class="layout">'+ renderSidebar() +
      '<div class="sidebar-overlay" id="side-ov" onclick="toggleMenu()"></div>'+
      '<div class="main-area"><div class="wrap">'+sync+body+'</div></div>'+
    '</div>';
}

function renderSidebar(){
  var pend = APP.conteos.filter(function(x){return !x.sincronizado;}).length;
  function link(vista,icono,texto,badge){
    var act=(APP.vista===vista)?' active':'';
    return '<button class="side-link'+act+'" onclick="navSide(\''+vista+'\')">'+icono+' <span>'+texto+'</span>'+(badge?'<span class="side-badge">'+badge+'</span>':'')+'</button>';
  }
  var html='<div class="sidebar" id="sidebar">';
  html+='<div class="side-group">App</div>';
  html+=link('inicio','📝','Nuevo conteo','');
  html+=link('lista','📋','Registros guardados',pend>0?pend:'');
  if(esSupervisor()) html+=link('estim','📈','Estimación','');
  if(esAdmin()){
    html+='<div class="side-group">Administración</div>';
    html+=link('panos','⚙️','Editar paños','');
    html+=link('config','👥','Configuración y usuarios','');
  }
  if(navigator.onLine&&fbOk){
    html+='<div class="side-group">Sincronización</div>';
    html+='<button class="side-link" onclick="sincronizar();subirTodosLosPanos()">☁️ <span>Subir a la nube</span></button>';
  }
  html+='</div>';
  return html;
}

function navSide(vista){
  if((vista==='panos'||vista==='config')&&!esAdmin()){ toast('Solo administradores'); return; }
  if(vista==='estim'&&!esSupervisor()){ toast('Solo supervisores y administradores'); return; }
  APP.vista=vista; render(); cerrarMenu();
}
function toggleMenu(){
  var sb=document.getElementById('sidebar'), ov=document.getElementById('side-ov');
  if(sb){ sb.classList.toggle('open'); if(ov) ov.classList.toggle('open'); }
}
function cerrarMenu(){
  var sb=document.getElementById('sidebar'), ov=document.getElementById('side-ov');
  if(sb){ sb.classList.remove('open'); if(ov) ov.classList.remove('open'); }
}

function variedades(){ return [...new Set(APP.panos.map(function(p){return p.variedad;}).filter(Boolean))].sort(); }

function renderInicio(){
  var vars = variedades();
  return '<div class="card">'+
      '<div style="font-size:19px;font-weight:800;color:#23303d;margin-bottom:4px">Nuevo conteo</div>'+
      '<div style="font-size:13px;color:#777;margin-bottom:15px">Seleccione el paño y cuente los centros florales por árbol.</div>'+
      '<div class="field"><label>Variedad</label><select id="cte-var" onchange="setVarFiltro(this.value)">'+
        '<option value="">— Todas —</option>'+vars.map(function(v){return '<option '+(APP.varFiltro===v?'selected':'')+'>'+esc(v)+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>Paño</label><select id="cte-pano">'+
        '<option value="">— Seleccione paño —</option>'+
        APP.panos.filter(function(p){return !APP.varFiltro||p.variedad===APP.varFiltro;}).map(function(p){
          return '<option value="'+esc(p.id)+'">'+esc(p.nombre)+' ('+esc(p.variedad)+')</option>';
        }).join('')+
      '</select></div>'+
      '<button class="btn btn-green" onclick="iniciarSesion()">▶️ Iniciar conteo</button>'+
    '</div>';
}
function setVarFiltro(v){ APP.varFiltro=v; render(); }

// ───── SESIÓN DE CONTEO ─────
function iniciarSesion(){
  var sel=document.getElementById('cte-pano'); var id=sel?sel.value:'';
  if(!id){ toast('Seleccione un paño'); return; }
  var pano=APP.panos.find(function(p){return String(p.id)===String(id);});
  if(!pano) return;
  APP.sesion = { id:uid(), panoId:pano.id, panoNombre:pano.nombre, variedad:pano.variedad,
    fechaInicio:new Date().toISOString(), usuario:APP.user.nombre, usuarioId:APP.user.id, arboles:[], sincronizado:false };
  APP.valActual=0; APP.vista='sesion'; render();
}
function renderSesion(){
  var s=APP.sesion;
  var n=s.arboles.length;
  var sum=s.arboles.reduce(function(a,x){return a+(x.centros||0);},0);
  var prom=n?(sum/n):0;
  return '<div class="hdr-mini">'+
      '<div style="font-size:17px;font-weight:800">'+esc(s.panoNombre)+'</div>'+
      '<div style="font-size:12px;opacity:.85">'+esc(s.variedad)+' · '+n+' árbol(es) · prom '+prom.toFixed(1)+'</div>'+
    '</div>'+
    '<div class="counter-box">'+
      '<div style="text-align:center;font-weight:800;color:#0a6ed1;margin-bottom:4px">🌳 Árbol N° '+(n+1)+'</div>'+
      '<div style="text-align:center;font-size:12px;color:#888;margin-bottom:6px">Centros florales</div>'+
      '<div class="counter">'+
        '<button class="minus" onclick="ajustar(-1)">−</button>'+
        '<div class="val" id="cte-val">'+APP.valActual+'</div>'+
        '<button class="plus" onclick="ajustar(1)">+</button>'+
      '</div>'+
      '<input type="number" inputmode="numeric" id="cte-input" value="'+APP.valActual+'" onchange="setVal(this.value)" style="width:100%;padding:11px;font-size:17px;text-align:center;border:2px solid #d9d9d9;border-radius:10px;margin-top:12px">'+
    '</div>'+
    '<button class="btn btn-green" onclick="guardarArbol()">✓ Guardar árbol y siguiente</button>'+
    (n>0?'<div class="card"><div style="font-weight:700;color:#354a5f;margin-bottom:6px">Árboles contados</div>'+
      s.arboles.map(function(a,i){return '<div class="arbol-row"><span>Árbol '+a.n+'</span><span style="font-weight:700">'+a.centros+(a.lat?' 📍':'')+'</span><button onclick="quitarArbol('+i+')" style="background:none;border:none;color:#c0392b;font-size:17px;cursor:pointer">✕</button></div>';}).join('')+
    '</div>':'')+
    '<button class="btn btn-primary" onclick="finalizarSesion()">🏁 Finalizar y guardar</button>'+
    '<button class="btn btn-gray" onclick="cancelarSesion()">Cancelar</button>';
}
function ajustar(d){ APP.valActual=Math.max(0,APP.valActual+d); var v=document.getElementById('cte-val'); if(v)v.textContent=APP.valActual; var i=document.getElementById('cte-input'); if(i)i.value=APP.valActual; }
function setVal(v){ APP.valActual=Math.max(0,parseInt(v)||0); var e=document.getElementById('cte-val'); if(e)e.textContent=APP.valActual; }
function guardarArbol(){
  if(APP.valActual<=0){ toast('Ingrese los centros del árbol'); return; }
  var n=APP.sesion.arboles.length+1;
  var reg={n:n,centros:APP.valActual,lat:null,lng:null,fecha:new Date().toISOString()};
  var seguro=(window.isSecureContext===true)||location.protocol==='https:';
  if(navigator.geolocation && seguro){
    toast('Capturando GPS...');
    navigator.geolocation.getCurrentPosition(function(pos){
      reg.lat=pos.coords.latitude; reg.lng=pos.coords.longitude; finArbol(reg);
    }, function(){ finArbol(reg); }, {timeout:12000,enableHighAccuracy:true,maximumAge:0});
  } else { finArbol(reg); }
}
function finArbol(reg){ APP.sesion.arboles.push(reg); APP.valActual=0; render(); toast('Árbol '+reg.n+(reg.lat?' con GPS ✓':' guardado')); }
function quitarArbol(i){ APP.sesion.arboles.splice(i,1); APP.sesion.arboles.forEach(function(a,idx){a.n=idx+1;}); render(); }
function cancelarSesion(){ if(confirm('¿Descartar el conteo en curso?')){ APP.sesion=null; APP.vista='inicio'; render(); } }

function finalizarSesion(){
  var s=APP.sesion;
  if(!s.arboles.length){ toast('Cuente al menos un árbol'); return; }
  s.fechaFin=new Date().toISOString();
  var sum=s.arboles.reduce(function(a,x){return a+(x.centros||0);},0);
  s.promedioCentros=sum/s.arboles.length;
  s.nArboles=s.arboles.length;
  s.sincronizado=false;
  APP.conteos.push(s);
  lsSet('cc_conteos', APP.conteos);

// ───── FIREBASE: subir/bajar ─────
function subirUno(s){
  if(!fbOk||!navigator.onLine) return;
  db.collection(COLECCION).doc(s.id).set(s).then(function(){
    s.sincronizado=true; s.fechaSync=new Date().toISOString();
    lsSet('cc_conteos', APP.conteos);
    if(APP.vista==='lista'||APP.vista==='inicio') render();
  }).catch(function(e){ console.warn('Error subiendo:',e); });
}
function sincronizar(){
  if(!navigator.onLine||!fbOk){ toast('Sin conexión'); return; }
  var pend=APP.conteos.filter(function(x){return !x.sincronizado;});
  if(!pend.length){ toast('Todo al día'); return; }
  var n=0;
  pend.forEach(function(s){
    db.collection(COLECCION).doc(s.id).set(s).then(function(){
      s.sincronizado=true; s.fechaSync=new Date().toISOString(); n++;
      lsSet('cc_conteos', APP.conteos);
      render();
    }).catch(function(e){ console.warn(e); });
  });
  toast('Subiendo '+pend.length+' registro(s)...');
}
function cargarDesdeNube(){
  if(!fbOk||!navigator.onLine) return;
  db.collection(COLECCION).get().then(function(snap){
    var remotos={};
    snap.forEach(function(doc){ remotos[doc.id]=doc.data(); });
    // Combinar: agregar los remotos que no estén local
    var ids=APP.conteos.map(function(x){return x.id;});
    Object.keys(remotos).forEach(function(id){
      if(ids.indexOf(id)<0){ remotos[id].sincronizado=true; APP.conteos.push(remotos[id]); }
    });
    lsSet('cc_conteos', APP.conteos);
    if(APP.vista==='lista'||APP.vista==='inicio') render();
  }).catch(function(e){ console.warn('Error cargando nube:',e); });
}

// Usa el promedio de centros florales de los conteos registrados.
// Fórmula: centros × frutos/centro × kg/fruto × N° plantas = kg/paño
function verEstim(){ if(!esSupervisor()){ toast('Solo supervisores y administradores'); return; } APP.vista='estim'; render(); }

// Promedio de centros florales por paño (de los conteos)
function promedioCentrosPano(panoId){
  var conteosPano = APP.conteos.filter(function(c){ return String(c.panoId)===String(panoId) && c.promedioCentros!=null; });
  if(!conteosPano.length) return null;
  var sum = conteosPano.reduce(function(a,c){ return a+c.promedioCentros; },0);
  return sum/conteosPano.length;
}

  var ess = APP.estimaciones.slice().sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); });

    return html;

      '</div>'+

      '</div>'+
    '</div>';
  }).join('');
  return html;
}

// Crear nueva estimación: precarga centros desde los conteos
function nuevaEstim(){
  var lineas = APP.panos.map(function(p){
    var centros = promedioCentrosPano(p.id);
    return {
      panoId:p.id, panoNombre:p.nombre, variedad:p.variedad,
      plantas: p.plantas||0,
      centros: centros!=null ? Number(centros.toFixed(1)) : 0,
      tieneCont: centros!=null,
      frutosCentro: 2,      // valores por defecto editables
      kgFruto: 0.011        // ~11 g por cereza
    };
  });
  APP.estimActual = {
    id: uid(),
    nombre: 'Estimación '+new Date().toLocaleDateString('es-CL'),
    fecha: new Date().toISOString(),
    usuario: APP.user.nombre,
    lineas: lineas
  };
  APP.vista='estimVer'; render();
}

function estimSet(i, campo, val){
  if(!APP.estimActual||!APP.estimActual.lineas[i]) return;
  APP.estimActual.lineas[i][campo] = parseFloat(val)||0;
  render();
}

function guardarEstim(){
  var e=APP.estimActual;
  e.nombre = (document.getElementById('es-nombre').value||'').trim() || e.nombre;
  // Calcular totales finales
  var totalKg=0;
  e.lineas.forEach(function(l){ l.kgPano=(l.centros||0)*(l.frutosCentro||0)*(l.kgFruto||0)*(l.plantas||0); totalKg+=l.kgPano; });
  e.totalKg = totalKg;
  e.modificado = new Date().toISOString();
  // Guardar o actualizar
  var idx = APP.estimaciones.findIndex(function(x){return x.id===e.id;});
  if(idx>=0){ APP.estimaciones[idx]=e; } else { APP.estimaciones.push(e); }
  lsSet('cc_estimaciones', APP.estimaciones);

  if(fbOk&&navigator.onLine){ db.collection(COLECCION_ESTIM).doc(e.id).set(e).catch(function(){}); }
  APP.vista='estim'; render();

    // Formulario nuevo usuario
    '<div class="card">'+
      '<div style="font-weight:800;color:#23303d;margin-bottom:8px">Agregar / actualizar usuario</div>'+
      '<div class="field"><label>Usuario (sin espacios)</label><input type="text" id="cf-user" autocapitalize="none" placeholder="ej: contador3"></div>'+
      '<div class="field"><label>Nombre</label><input type="text" id="cf-nombre" placeholder="ej: Juan Pérez"></div>'+
      '<div class="field"><label>Clave</label><input type="text" id="cf-clave" placeholder="clave de acceso"></div>'+
      '<div class="field"><label>Rol</label><select id="cf-rol">'+
        Object.keys(ROLES).map(function(r){return '<option value="'+r+'">'+esc(ROLES[r])+'</option>';}).join('')+
      '</select></div>'+
      '<button class="btn btn-green" onclick="guardarUsuario()">💾 Guardar usuario</button>'+
    '</div>'+
    // Lista de usuarios
    '<div class="card">'+
      '<div style="font-weight:800;color:#23303d;margin-bottom:8px">Usuarios registrados ('+users.length+')</div>'+
      users.map(function(u){
        var info=APP.usuarios[u];
        var rolColor = info.rol==='admin'?'#0a6ed1':(info.rol==='supervisor'?'#e9730c':'#6a7889');
        return '<div style="padding:10px;border-bottom:1px solid #eee">'+
          '<div style="display:flex;justify-content:space-between;align-items:center">'+
            '<div><div style="font-weight:700">'+esc(info.nombre||u)+' <span style="font-size:11px;color:#999">('+esc(u)+')</span></div>'+
              '<div style="font-size:12px"><span class="pill" style="background:'+rolColor+';color:#fff">'+esc(ROLES[info.rol]||info.rol)+'</span> <span style="color:#aaa;font-size:11px">clave: '+esc(info.clave)+'</span></div></div>'+
            '<div style="display:flex;gap:6px">'+
              '<button class="btn-sm btn-gray" onclick="editarUsuario(\''+esc(u)+'\')">✏️</button>'+
              (u!==APP.user.id?'<button class="btn-sm btn-red" onclick="eliminarUsuario(\''+esc(u)+'\')">🗑️</button>':'')+
            '</div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>';
  return html;
}

function guardarUsuario(){
  var u=(document.getElementById('cf-user').value||'').trim().toLowerCase().replace(/\s+/g,'');
  var nombre=(document.getElementById('cf-nombre').value||'').trim();
  var clave=(document.getElementById('cf-clave').value||'').trim();
  var rol=document.getElementById('cf-rol').value;
  if(!u||!clave){ toast('Complete usuario y clave'); return; }
  APP.usuarios[u]={ clave:clave, nombre:nombre||u, rol:rol };
  lsSet('cc_usuarios', APP.usuarios);
  // Subir a Firebase
  if(fbOk&&navigator.onLine){ db.collection(COLECCION_USERS).doc(u).set(APP.usuarios[u]).catch(function(){}); }
  render(); toast('Usuario guardado: '+u);
}

function editarUsuario(u){
  var info=APP.usuarios[u]; if(!info) return;
  document.getElementById('cf-user').value=u;
  document.getElementById('cf-nombre').value=info.nombre||'';
  document.getElementById('cf-clave').value=info.clave||'';
  document.getElementById('cf-rol').value=info.rol||'contador';
  window.scrollTo({top:0,behavior:'smooth'});
  toast('Editando '+u+'. Modifique y guarde.');
}

function eliminarUsuario(u){
  if(u===APP.user.id){ toast('No puede eliminar su propio usuario'); return; }
  // Evitar quedar sin ningún admin
  var admins=Object.keys(APP.usuarios).filter(function(k){return APP.usuarios[k].rol==='admin';});
  if(APP.usuarios[u].rol==='admin' && admins.length<=1){ toast('Debe quedar al menos un administrador'); return; }
  if(!confirm('¿Eliminar el usuario '+u+'?')) return;
  delete APP.usuarios[u];
  lsSet('cc_usuarios', APP.usuarios);
  if(fbOk&&navigator.onLine){ db.collection(COLECCION_USERS).doc(u).delete().catch(function(){}); }
  render(); toast('Usuario eliminado');
}

// Cargar usuarios desde la nube (combina con semilla; la nube tiene prioridad)
function cargarUsuariosNube(){
  if(!fbOk||!navigator.onLine) return;
  db.collection(COLECCION_USERS).get().then(function(snap){
    if(!snap.empty){
      snap.forEach(function(doc){ APP.usuarios[doc.id]=doc.data(); });
      lsSet('cc_usuarios', APP.usuarios);
    } else {
      // Primera vez: subir la semilla a Firebase
      Object.keys(APP.usuarios).forEach(function(u){
        db.collection(COLECCION_USERS).doc(u).set(APP.usuarios[u]).catch(function(){});
      });
    }
    // Si el usuario en sesión cambió de rol, refrescar
    if(APP.user && APP.usuarios[APP.user.id]){
      APP.user.rol = APP.usuarios[APP.user.id].rol;
      APP.user.nombre = APP.usuarios[APP.user.id].nombre||APP.user.nombre;
      lsSet('cc_user', APP.user);
    }
  }).catch(function(e){ console.warn('Usuarios nube:',e); });
}

// Detectar online/offline
window.addEventListener('online', function(){ if(APP.user){ render(); cargarDesdeNube(); } });
window.addEventListener('offline', function(){ if(APP.user) render(); });

// Iniciar
init();
</script>

</html>
